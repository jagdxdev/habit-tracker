<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Outer glowing progress ring -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="26" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#ringGrad)" stroke-width="26" 
          stroke-linecap="round" stroke-dasharray="930" stroke-dashoffset="240" transform="rotate(-90 256 256)" />
  
  <!-- Central checkmark -->
  <path d="M180 258 L232 312 L336 204" fill="none" stroke="#ffffff" stroke-width="32" 
        stroke-linecap="round" stroke-linejoin="round" />
</svg>